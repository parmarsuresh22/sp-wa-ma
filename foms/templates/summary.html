{% extends "base.html" %}
{% block title %}Summary · FOMS{% endblock %}
{% block head %}<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>{% endblock %}
{% block body %}
<div class="container" style="max-width:100%">
  <div class="page-head">
    <a href="#" id="backLink" class="btn ghost sm">← Forms</a>
    <h1 id="formTitle">Summary</h1>
    <span class="badge" id="statusBadge"></span>
    <div class="spacer"></div>
    <a class="btn ghost sm" id="designLink">✎ Design</a>
    <a class="btn primary" id="newFormBtn">+ Submit New Form</a>
  </div>

  <div class="flex" style="margin-bottom:14px;gap:10px;flex-wrap:wrap">
    <span class="subtle">Viewing as role:</span>
    <select id="roleSelect" style="width:auto;min-width:150px"></select>
    <span class="pill" id="viewOnlyBadge" style="display:none;border-color:var(--amber);color:var(--amber)">view-only</span>
  </div>

  <div class="flex" style="margin-bottom:14px;gap:10px;flex-wrap:wrap">
    <span class="subtle">Columns:</span>
    <div id="columnChips" class="wrap-gap"></div>
    <select id="addColumnSelect" style="width:auto"><option value="">+ Add column…</option></select>
  </div>

  <div class="flex" style="margin-bottom:14px;gap:10px;flex-wrap:wrap">
    <div class="finder">
      <input type="search" id="subSearch" placeholder="Search submissions…" autocomplete="off">
      <select id="subJump"><option value="">Jump to submission…</option></select>
    </div>
  </div>

  <div class="tablewrap"><table class="data" id="summaryTable"></table></div>
</div>
<script>const FORM_ID = {{ form_id }};</script>
{% endblock %}
{% block scripts %}<script src="{{ url_for('static', filename='js/summary.js') }}?v={{ asset_ver }}"></script>{% endblock %}
